[package]
name = "rax-gateway"
version = "0.12.0"
edition = "2024"
description = "An opinionated RAX gateway: nodes, the clients that use them, and who may do what"
license = "MIT"
publish = false
repository = "https://github.com/miere/rax-rs"

[lib]
name = "rax_gateway"

[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite"]
bin = ["sqlite", "dep:clap", "dep:toml", "dep:tracing-subscriber", "tokio/signal"]

[dependencies]
rax = { path = "../rax" }
rax-tokio = { path = "../rax-tokio" }
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
hex = "0.4"
rand = "0.10"
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
time = { version = "0.3", features = ["serde-well-known"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
clap = { version = "4", features = ["derive"], optional = true }
toml = { version = "1", optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "env-filter"], optional = true }

[dev-dependencies]
rax-sim = { path = "../rax-sim" }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
