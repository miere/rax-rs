[package]
name = "rax-sim"
version = "0.12.0"
edition = "2024"
description = "A scriptable RAX gateway for testing and benchmarking nodes"
license = "MIT"
publish = false
repository = "https://github.com/miere/rax-rs"

[lib]
name = "rax_sim"

[dependencies]
rax = { path = "../rax" }
rax-tokio = { path = "../rax-tokio" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
